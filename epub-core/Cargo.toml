[package]
name = "epub-core"
version = "0.1.0"
edition = "2024"

[dependencies]
percent-encoding = "=2.3.2"
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
zip = { version = "=9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
anyhow = "=1.0.104"
