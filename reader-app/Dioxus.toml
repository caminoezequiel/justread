# Settings for the Dioxus CLI (`dx serve`, `dx bundle`). Field names follow
# dioxus-cli 0.7.10 (src/config/{app,bundle}.rs).

[application]
name = "justread"

[bundle]
# Reverse-DNS id used by macOS and Linux desktop integration. Change it to a
# domain you control before publishing.
identifier = "io.github.justread"
publisher = "Ezequiel Camino"
category = "Utility"
short_description = "A lightweight EPUB reader"
long_description = "justread reads EPUB books straight from the file, remembers your place in every book, and offers light, sepia and dark themes with adjustable text size and line width."
copyright = "© 2026 Ezequiel Camino"
# PNGs are used on Linux and turned into an .icns on macOS; the .ico is the
# Windows executable icon. Regenerate with `python3 icons/make_icons.py`.
# (No 256x256.png here: the bundler also installs the .ico's 256px image on
# Linux, and two files at the same path make the .rpm build fail.)
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/512x512.png",
    "icons/icon.ico",
]

[bundle.deb]
# Runtime libraries of a Dioxus desktop app on Debian/Ubuntu.
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxdo3"]
# Our own .desktop entry (lowercase name, "Open with" for .epub files).
# dx reads this path relative to the directory it runs in, so always run
# `dx bundle` from the workspace root.
desktop_template = "reader-app/packaging/justread.desktop"

[bundle.windows.webview_install_mode.DownloadBootstrapper]
# Windows 10 and 11 already ship the WebView2 runtime. dx's default embeds the
# ~170 MB offline installer in every .msi/.exe; this instead downloads it
# during installation, only on the rare machine that lacks it.
silent = true
