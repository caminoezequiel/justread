<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<!-- Read by reader.js: the app waits for this page's own `ready` message,
     sent once the pages exist, so the saved position lands on real pages. -->
<script>window.justreadDeferReady = true;</script>
<style>
  body { margin: 0; background: #d9d9d9; }
  #pages { margin: 0 auto; padding: 16px 0; }
  .page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .page canvas { display: block; }
  /* Text layer, as PDF.js lays it out. Transparent text: the canvas shows the
     page. -webkit-text-fill-color (not color) so the chapter theme CSS, which
     forces `color` on every element, can't make it visible. */
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; }
  .textLayer > span { color: transparent; -webkit-text-fill-color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; }
  .textLayer ::selection { background: rgba(0, 100, 255, .3); }
  /* Only the links take clicks: the words under them stay selectable and translatable. */
  .links { position: absolute; inset: 0; pointer-events: none; }
  .links a { position: absolute; display: block; pointer-events: auto; }
</style>
</head>
<body class="jr-pdf">
<div id="pages"></div>
<script type="module" src="/__justread/pdf-viewer.js"></script>
</body>
</html>
