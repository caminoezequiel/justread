name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: test
    # Installers are built for pushes, tags and manual runs, not for every PR.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --package-types deb --package-types rpm
          - os: macos-latest
            packages: --package-types macos --package-types dmg
          - os: windows-latest
            packages: --package-types msi --package-types nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Also caches ~/.cargo/bin, so the dx install below is quick after the
      # first run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install the Dioxus CLI (same version as the dioxus crate)
        shell: bash
        run: |
          if ! dx --version 2>/dev/null | grep -q "0.7.10"; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi

      # Run from the workspace root: Dioxus.toml paths assume it.
      - name: Bundle
        run: dx bundle -p reader-app --desktop --release ${{ matrix.packages }} --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: justread-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
