name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Also run by the Release workflow (release.yml) for the commit it tagged.
  # A tag pushed by a workflow doesn't trigger `push`, hence this entry.
  workflow_call:
    inputs:
      # Only a tag, never an arbitrary branch or SHA: the jobs check it out and
      # build it, and a release must come from a commit release.yml tagged.
      release_tag:
        description: Build this tag and publish a GitHub Release for it (empty = the commit that triggered the run, no release)
        type: string
        default: ""

# Read-only token by default; only the release job asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: test
    # Installers are built for pushes, tags and manual runs, not for every PR.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --package-types deb --package-types rpm
          - os: macos-latest
            packages: --package-types macos --package-types dmg
          - os: windows-latest
            packages: --package-types msi --package-types nsis
    runs-on: ${{ matrix.os }}
    env:
      # Installers that become a GitHub Release (same test as the release job).
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable

      # Also caches ~/.cargo/bin, so the dx install below is quick after the
      # first run. Not for releases: anything that ever ran on main (a
      # dependency's build script, an action) could have written that cache,
      # and published installers must not be built from it (cache poisoning).
      - uses: Swatinem/rust-cache@v2
        if: env.RELEASE != 'true'
        with:
          key: bundle

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install the Dioxus CLI (same version as the dioxus crate)
        shell: bash
        run: |
          if ! dx --version 2>/dev/null | grep -q "0.7.10"; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi

      # Run from the workspace root: Dioxus.toml paths assume it.
      - name: Bundle
        run: dx bundle -p reader-app --desktop --release ${{ matrix.packages }} --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: justread-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: bundle
    # For version tags pushed from a computer (`git push origin v0.1.0`), or
    # when the Release workflow asks for it. (In a called workflow, github.ref
    # is the caller's branch, so the tag comes in as an input.)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      # Installer names contain the crate version, so a tag that doesn't
      # match it would publish mislabelled files.
      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' reader-app/Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match reader-app version $version (expected v$version)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: justread-*
          merge-multiple: true

      # Only files become release assets (the macOS .app is a folder; the
      # .dmg next to it is what macOS users download). --verify-tag: the tag
      # must already exist; never create one here from some other commit.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -maxdepth 1 -type f -print
          find dist -maxdepth 1 -type f -print0 | xargs -0 \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "justread $TAG" --generate-notes
